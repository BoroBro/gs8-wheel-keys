plugins { id 'com.android.application' }
android {
    namespace 'com.gs8.wheelkeys'
    compileSdk 34
    defaultConfig {
        applicationId "com.gs8.wheelkeys"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { }
