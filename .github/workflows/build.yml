name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Prepare versioned APK
        id: prep
        run: |
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          TAG="v${VN}-b${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/gs8-wheelkeys-${TAG}.apk"
          ls -la dist
      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.tag }}
          files: dist/*.apk
          make_latest: true
